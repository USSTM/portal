services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usstm_portal
      POSTGRES_USER: usstm
      POSTGRES_PASSWORD: usstm
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U usstm -d usstm_portal']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usstm_portal_test
      POSTGRES_USER: usstm
      POSTGRES_PASSWORD: usstm
    ports:
      - '${POSTGRES_TEST_PORT:-5434}:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U usstm -d usstm_portal_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  postgres-test-data:
