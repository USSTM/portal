name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: usstm_portal_test
          POSTGRES_USER: usstm
          POSTGRES_PASSWORD: usstm
        options: >-
          --health-cmd "pg_isready -U usstm -d usstm_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://usstm:usstm@localhost:5432/usstm_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

  release-changes:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.filter.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          COMMIT: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != push ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo 'result=deploy' >> "$GITHUB_OUTPUT"
          else
            result="$(git diff --no-renames --name-only "$BEFORE" "$COMMIT" | bash deployment/release-changes.sh)"
            echo "result=$result" >> "$GITHUB_OUTPUT"
          fi

  build-images:
    needs: [verify, release-changes]
    if: needs.release-changes.outputs.result == 'deploy'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: portal-web
            dockerfile: apps/portal/Dockerfile
            target: runtime
          - name: portal-migrate
            dockerfile: apps/portal/Dockerfile
            target: migrate
          - name: portal-auth
            dockerfile: apps/auth/Dockerfile
            target: ''
          - name: portal-backup
            dockerfile: deployment/backup/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/usstm/${{ matrix.name }}:${{ github.sha }}
      - name: Record published digest
        if: github.event_name == 'push'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.name }}
          path: image-digest.txt
          if-no-files-found: error
