name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: usstm_portal
          POSTGRES_USER: usstm
          POSTGRES_PASSWORD: usstm
        options: >-
          --health-cmd "pg_isready -U usstm -d usstm_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://usstm:usstm@localhost:5432/usstm_portal
      DATABASE_URI: postgresql://usstm_website:usstm_website@localhost:5432/usstm_website
      PAYLOAD_SECRET: ci-payload-secret
      PORTAL_PUBLIC_URL: http://localhost:3000
      S3_ACCESS_KEY_ID: ci
      S3_BUCKET: ci
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ci
      # Pull requests only run tasks for packages changed against the base
      # branch; pushes to main run everything.
      AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --affected compares against the base branch.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Create website database
        env:
          PGPASSWORD: usstm
        run: |
          psql -h localhost -U usstm -d usstm_portal -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE usstm_website LOGIN PASSWORD 'usstm_website'" \
            -c "CREATE DATABASE usstm_website OWNER usstm_website"
      - run: pnpm format
      - run: pnpm turbo run lint typecheck test $AFFECTED
      - run: pnpm db:migrate
      - run: pnpm turbo run test:integration build $AFFECTED
      - run: pnpm test:deployment
      - run: pnpm test:deployment:integration
